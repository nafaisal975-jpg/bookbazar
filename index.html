<style>
:root{--sky:#173F35;--sky-d:#245B4B;--btn:#173F35;--navy:#173F35;--mist:#E8EFE7;--bg:#FBF8F0;--line:#E8E2D6;--ink:#263B34;--muted:#5E6D65;--red:#C84F3D;--r:16px;--sh:0 12px 32px rgba(23,63,53,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:130px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Hind Siliguri",Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #EFC15F;outline-offset:2px}[hidden]{display:none!important}
.wrap{width:min(1160px,calc(100% - 32px));margin:auto}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0 8px}
.logo{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:800;color:var(--navy);letter-spacing:-.5px}

.btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:12px;padding:9px 14px;font-weight:700;transition:.15s}
.btn:hover{border-color:var(--sky);transform:translateY(-1px)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:#fff}.btn.pri:hover{background:#245B4B}
.btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.danger{color:var(--red);border-color:#f2c4c4}.btn:disabled{opacity:.6;cursor:wait}
.lang{border:1px solid var(--line);border-radius:12px;background:#fff;padding:9px 8px;color:var(--navy);font-weight:700}
.search{display:grid;grid-template-columns:170px 1fr auto;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0 0 12px;box-shadow:var(--sh)}
.search select,.search input{border:0;background:transparent;padding:13px 14px;min-width:0;color:var(--ink)}
.search select{border-right:1px solid var(--line);background:var(--mist)}
.search button{border:0;background:var(--btn);color:#fff;font-weight:800;padding:0 24px}
.hero{background:linear-gradient(180deg,var(--mist),#fff);border-bottom:1px solid var(--line)}
.hero-in{display:grid;grid-template-columns:1.4fr .8fr;gap:24px;align-items:center;padding:46px 0}
.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.1;letter-spacing:-1.5px;color:var(--navy);margin:0 0 14px;max-width:640px}
.hero p{color:var(--muted);font-size:17px;max-width:540px;margin:0 0 22px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.shelf{justify-self:center;display:flex;align-items:flex-end;gap:7px;padding:22px 24px 0;background:#fff;border:1px solid var(--line);border-radius:22px 22px 6px 6px;box-shadow:var(--sh);border-bottom:10px solid var(--sky)}
.shelf b{display:block;border-radius:5px 5px 0 0;width:34px}
main{padding:24px 0 40px}
h2.t{font-size:25px;letter-spacing:-.6px;color:var(--navy);margin:8px 0 2px}.sub{color:var(--muted);margin:0 0 14px}
.cats{display:flex;gap:8px;overflow:auto;padding:2px 1px 12px}
.chip{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:8px 14px;white-space:nowrap;font-weight:700}
.chip.on{background:var(--btn);border-color:var(--btn);color:#fff}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filters select,.filters input{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 10px;color:var(--ink)}.filters input{width:120px}
.count{margin-right:auto;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.18s}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:#EFC15F}
.open{border:0;background:none;padding:0;text-align:left;color:inherit;display:flex;flex-direction:column;flex:1}
.cover{height:175px;display:grid;place-items:center;background:var(--mist);position:relative;overflow:hidden;width:100%}
.cover img{width:100%;height:100%;object-fit:cover}.emo{font-size:64px}
.cond{position:absolute;top:10px;left:10px;background:#fff;color:var(--navy);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800}
.cb{padding:13px;display:flex;flex-direction:column;gap:5px;flex:1}
.price{font-size:20px;font-weight:800;color:var(--sky-d)}.bt{font-weight:700;line-height:1.35}.meta{color:var(--muted);font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto;padding-top:8px}
.tag{background:var(--mist);color:var(--navy);border-radius:7px;padding:3px 7px;font-size:11px;font-weight:700;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.heart{border:1px solid var(--line);background:#fff;border-radius:10px;width:34px;height:32px;font-size:17px;color:var(--sky-d)}
.heart.on{color:var(--red);background:#fff0f0;border-color:#f2c4c4}
.cf{padding:0 12px 12px;display:flex;justify-content:flex-end}
.empty{grid-column:1/-1;text-align:center;border:1px dashed #B8CDBD;border-radius:var(--r);padding:44px 14px;color:var(--muted);background:#fff}
.empty strong{display:block;color:var(--navy);font-size:19px;margin-bottom:5px}
.more{text-align:center;margin-top:20px}
.band{padding:36px 0;border-top:1px solid var(--line)}.band.alt{background:var(--mist)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.box b{display:block;color:var(--navy);margin:4px 0}.box p{margin:0;color:var(--muted);font-size:13px}.box .n{font-size:24px}
footer{background:var(--navy);color:#FFFDF7;padding:28px 0 18px}footer .logo{color:#fff}footer p{color:#E6E5D9;max-width:340px}
.ft{display:flex;gap:22px;flex-wrap:wrap;justify-content:space-between}.fl{display:flex;gap:12px 20px;flex-wrap:wrap;font-size:13px}.fl a:hover{color:#EFC15F}
.fb{border-top:1px solid #ffffff22;margin-top:18px;padding-top:14px;font-size:12px;color:#E6E5D9}
dialog{width:min(560px,calc(100% - 24px));max-height:90vh;overflow:auto;border:0;border-radius:20px;padding:0;background:#fff;color:var(--ink);box-shadow:0 25px 80px rgba(23,63,53,.22)}
dialog::backdrop{background:#173F3588;backdrop-filter:blur(3px)}
.modal{padding:22px;display:grid;gap:13px}.mh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal h2{margin:0;color:var(--navy);font-size:23px}.x{border:0;background:var(--mist);color:var(--navy);border-radius:10px;width:36px;height:36px;font-size:21px}
.f{display:grid;gap:5px;font-weight:700;font-size:13px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.note{font-size:12px;color:var(--muted);margin:0}
.ma{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.link{border:0;background:none;color:var(--sky-d);font-weight:700;text-decoration:underline;padding:4px}
.dc{width:100%;height:auto;max-height:70vh;border-radius:14px;overflow:hidden;background:var(--mist);display:grid;place-items:center}.dc img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain}.dc .emo{font-size:90px;padding:30px}
.th{display:flex;gap:7px;flex-wrap:wrap}.th img{width:62px;height:62px;object-fit:cover;border-radius:9px;border:2px solid var(--line);cursor:pointer}.th img.on{border-color:var(--sky)}
.dp{font-size:29px;font-weight:800;color:var(--sky-d)}.info{background:var(--mist);border-radius:12px;padding:12px;font-size:13px}.desc{white-space:pre-wrap;color:var(--muted);margin:0}
#pv{display:flex;gap:8px;flex-wrap:wrap}.pvi{position:relative}.pvi img{width:64px;height:64px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.pvi button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--red);color:#fff;line-height:1}
.toast{position:fixed;inset:auto auto 20px 50%;margin:0;border:0;width:max-content;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:999px;padding:10px 16px;box-shadow:var(--sh);max-width:calc(100% - 28px);text-align:center}.sk{height:290px;background:linear-gradient(90deg,var(--mist),#fff,var(--mist));background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}.thb{border:0;background:none;padding:0}.thb.on img{border-color:var(--sky)}

async function load(reset){
 if(!db){loading=false;fail=true;render();toast(t("noDb"));return}
 const my=++reqId;if(reset){page=0;books=[];total=null}
 loading=true;fail=false;render();
 try{
  let data=[],count=0;
  if(!(S.savedOnly&&!saved.size)){
   let q=db.from("books").select(COLS,{count:"exact"});
   if(S.cat!=="all")q=q.eq("category",S.cat);
   if(S.city!=="all")q=q.eq("city",S.city);
   if(S.cond!=="any")q=q.eq("condition",S.cond);
   if(S.maxp!=="")q=q.lte("price",Number(S.maxp));
   if(S.mine&&S.user)q=q.eq("user_id",S.user.id);
   if(S.savedOnly)q=q.in("id",[...saved].slice(0,200));
   const term=S.q.trim().replace(/[%_\\,()"*]/g," ").replace(/\s+/g," ").trim();
   if(term)q=q.or(["title","author","description","area","category","city"].map(c=>`${c}.ilike."%${term}%"`).join(","));
   if(S.sort==="low")q=q.order("price",{ascending:true});else if(S.sort==="high")q=q.order("price",{ascending:false});
   q=q.order("created_at",{ascending:false}).order("id",{ascending:false});
   const res=await q.range(page*PAGE,page*PAGE+PAGE-1);if(res.error)throw res.error;
   data=res.data||[];count=res.count??data.length;
  }
  if(my!==reqId)return;
  const have=new Set(books.map(b=>b.id));
  books=books.concat(data.map(map).filter(b=>!have.has(b.id)));total=count;hasMore=(page+1)*PAGE<count;page++;
 }catch(err){if(my!==reqId)return;fail=true;toast(t("loadErr")+(err.message||err))}
 loading=false;render();if(!hashDone&&S.user&&!fail){hashDone=true;openFromHash()}
}
async function openFromHash(){const m=location.hash.match(/^#b-([\w-]+)$/);if(!m||!S.user||!db)return;const id=m[1];

async function pruneSaved(){if(!db||!S.user||!saved.size)return;const ids=[...saved].slice(0,200),{data,error}=await db.from("books").select("id").in("id",ids);if(error)return;const ok=new Set((data||[]).map(x=>String(x.id)));let ch=false;ids.forEach(i=>{if(!ok.has(i)){saved.delete(i);ch=true}});if(ch){persist();render()}}

function paintUser(u){
 if(u!==undefined){const md=u?.user_metadata||{};S.user=u?{id:u.id,name:md.full_name||u.email,email:u.email}:null;if(!u)S.mine=false}
 $("loginBtn").textContent=S.user?t("profile"):t("login");$("mineBtn").hidden=!S.user;$("mineBtn").textContent=t(S.mine?"allPosts":"myPosts");
 $("mineBtn").classList.toggle("on",S.mine);$("profMine").textContent=t(S.mine?"allPosts":"myPosts");
}
$("authForm").addEventListener("submit",async e=>{
 e.preventDefault();if(!db){$("aMsg").textContent=t("noDb");return}
 const mail=$("aMail").value.trim(),pw=$("aPass").value,go=$("aGo");go.disabled=true;$("aMsg").textContent="";
 try{
  if(mode==="signup"){const {data,error}=await db.auth.signUp({email:mail,password:pw,options:{data:{full_name:$("aName").value.trim()},emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
   if(data.session){paintUser(data.user);setAuthGate(data.user);load(true);toast(t("created"))}else $("aMsg").textContent=t("checkMail")}
  else if(mode==="login"){const {data,error}=await db.auth.signInWithPassword({email:mail,password:pw});if(error)throw error;paintUser(data.user);setAuthGate(data.user);load(true);toast(t("welcome"))}
  else if(mode==="forgot"){const {error}=await db.auth.resetPasswordForEmail(mail,{redirectTo:location.origin+location.pathname});if(error)throw error;$("aMsg").textContent=t("resetSent")}
  else{const {error}=await db.auth.updateUser({password:pw});if(error)throw error;closeD("loginDlg");toast(t("passSaved"));setMode("login")}
 }catch(err){$("aMsg").textContent=err.message||String(err)}
 go.disabled=false;
});
$("aToggle").onclick=()=>setMode(mode==="login"?"signup":"login");
$("forgotBtn").onclick=()=>setMode("forgot");
$("loginBtn").onclick=()=>{if(!S.user){setMode("login");openD("loginDlg");return}
 $("profInfo").innerHTML=`<strong>${esc(S.user.name)}</strong><br>${esc(S.user.email)}`;openD("profDlg")};
$("profOut").onclick=async()=>{try{await db.auth.signOut()}catch{}paintUser(null);closeD("profDlg");setAuthGate(null);load(true);toast(t("loggedOut"))};
function toggleMine(){if(!S.user)return;S.mine=!S.mine;S.savedOnly=false;S.cat="all";S.city="all";S.cond="any";S.q="";S.maxp="";$("q").value="";$("maxp").value="";$("loc").value="all";$("cond").value="any";cats();paintUser();load(true);$("marketplace").scrollIntoView()}
$("mineBtn").onclick=toggleMine;$("profMine").onclick=()=>{closeD("profDlg");toggleMine()};
if(db){
 db.auth.getSession().then(({data})=>{const u=data.session?.user||null;paintUser(u);setAuthGate(u);if(u){load(true);pruneSaved()}else render()}).catch(()=>{setAuthGate(null);$("aMsg").textContent=t("noDb")});
 db.auth.onAuthStateChange((ev,s)=>{if(ev==="PASSWORD_RECOVERY"){setMode("newpass");openD("loginDlg")}const hadUser=!!S.user,wm=S.mine;paintUser(s?.user||null);setAuthGate(s?.user||null);if((s?.user&&!hadUser)||(wm&&!S.mine))load(true);else render()});
}

/* listing form */
function pv(){$("pv").innerHTML=[...keep.map((u,i)=>[u,"k",i]),...fresh.map((u,i)=>[u,"n",i])].map(([u,k,i])=>`<span class="pvi"><img src="${esc(u)}" alt=""><button type="button" data-rm="${k}${i}" aria-label="Remove photo">×</button></span>`).join("")}
function resetForm(){editId=null;$("sellForm").reset();keep=[];fresh=[];pv();$("sellTitle").textContent=t("listT");$("sellSubmit").textContent=t("publish")}
function openSell(){if(!S.user){toast(t("needLogin"));setMode("login");openD("loginDlg");return}resetForm();openD("sellDlg")}
$("sellBtn").onclick=openSell;$("heroSell").onclick=openSell;
async function editBook(b){resetForm();editId=b.id;keep=[...b.photos];pv();
 $("bTitle").value=b.title;$("bCat").value=b.category;$("bPrice").value=b.price;$("bCond").value=b.condition;$("bCity").value=b.city;$("bArea").value=b.area;$("bAuthor").value=b.author;$("bDesc").value=b.description;
 $("sellTitle").textContent=t("editT");$("sellSubmit").textContent=t("saveChanges");openD("sellDlg");const {data:ph}=await db.rpc("get_book_phone",{book_id:b.id});if(ph)$("bPhone").value=ph}
function resize(f){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.75))};im.src=r.result};r.readAsDataURL(f)})}
$("bPhotos").onchange=async e=>{
 for(const f of Array.from(e.target.files||[])){if(keep.length+fresh.length>=3){toast(t("photoLimit"));break}if(!f.type.startsWith("image/"))continue;if(f.size>15e6){toast(t("photoBig"));continue}try{fresh.push(await resize(f))}catch{toast(t("photoErr"))}}
 e.target.value="";pv();
};
$("pv").onclick=e=>{const b=e.target.closest("[data-rm]");if(!b)return;const k=b.dataset.rm[0],i=Number(b.dataset.rm.slice(1));(k==="k"?keep:fresh).splice(i,1);pv()};
async function upload(uid){const out=[];try{for(const d of fresh){const blob=await (await fetch(d)).blob(),path=`${uid}/${crypto.randomUUID()}.jpg`;
 const {error}=await db.storage.from("book-photos").upload(path,blob,{contentType:"image/jpeg"});if(error)throw error;out.push(db.storage.from("book-photos").getPublicUrl(path).data.publicUrl)}}catch(e){await rmPhotos(out);throw e}return out}
$("sellForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const title=$("bTitle").value.trim(),price=Number($("bPrice").value),city=$("bCity").value,phone=$("bPhone").value.replace(/[\s-]/g,"");
 if(!title||!Number.isFinite(price)||price<0||!city){toast(t("req"));return}
 if(!/^(\+?88)?01[3-9]\d{8}$/.test(phone)){toast(t("badPhone"));return}
 if(!db){toast(t("noDb"));return}
 const {data:ud}=await db.auth.getUser(),u=ud?.user;if(!u){toast(t("needLogin"));closeD("sellDlg");setMode("login");openD("loginDlg");return}
 const btn=$("sellSubmit"),was=!!editId;let up=[];const old=was?(books.find(b=>b.id===editId)?.photos||[]):[];btn.disabled=true;btn.textContent=t("publishing");
 try{
  up=await upload(u.id);const photos=[...keep,...up];
  const row={user_id:u.id,title,category:$("bCat").value,price,condition:$("bCond").value,city,area:$("bArea").value.trim(),author:$("bAuthor").value.trim(),phone:phone.replace(/^\+?88/,""),description:$("bDesc").value.trim(),photos,emoji:"📚",color:"#E8EFE7"};
  let r;
  if(was){r=await db.from("books").update(row).eq("id",editId).eq("user_id",u.id).select(COLS).single();if(r.error)throw r.error;books=books.map(b=>b.id===editId?map(r.data):b)}
  else{r=await db.from("books").insert(row).select(COLS).single();if(r.error)throw r.error;books.unshift(map(r.data))}
  rmPhotos(old.filter(p=>!photos.includes(p)));up=[];
  Object.assign(S,{cat:"all",city:"all",cond:"any",q:"",maxp:"",savedOnly:false,mine:false});$("q").value="";$("maxp").value="";$("loc").value="all";$("cond").value="any";
  cats();paintUser();load(true);closeD("sellDlg");resetForm();toast(t(was?"saved2":"published"));$("marketplace").scrollIntoView();
 }catch(err){if(up.length)rmPhotos(up);toast((err&&err.message)||String(err))}
 btn.disabled=false;btn.textContent=t(editId?"saveChanges":"publish");
});

/* detail */
function show(id){const b=books.find(x=>x.id===id)||extra.get(id);if(!b)return;const own=S.user&&b.user_id===S.user.id,sv=saved.has(b.id);
 $("detBox").innerHTML=`<div class="mh"><h2 id="detT">${t("details")}</h2><button class="x" type="button" data-close="detDlg" aria-label="Close">×</button></div>
 <div class="dc" id="dcv">${b.photos[0]?`<img src="${esc(b.photos[0])}" alt="${esc(b.title)}">`:`<span class="emo">${esc(b.emoji)}</span>`}</div>
 ${b.photos.length>1?`<div class="th">${b.photos.map((p,i)=>`<button type="button" class="thb ${i?"":"on"}" data-ph="${i}" aria-label="${t("photoN")} ${i+1}"><img src="${esc(p)}" alt=""></button>`).join("")}</div>`:""}
 <h2>${esc(b.title)}</h2><div class="dp">${money(b.price)}</div>
 <div class="info">${esc(catName(b.category))} · ${cond(b.condition)}<br>📍 ${esc(b.area?b.area+", ":"")}${esc(cityName(b.city))}<br>${esc(b.author?t("author")+": "+b.author:t("noAuthor"))}<br>${t("listed")} ${new Date(b.created).toLocaleDateString(loc())}</div>
 <p class="desc">${esc(b.description||t("noDesc"))}</p>
 <div class="ma" id="dAct"><button class="btn" type="button" data-save="${esc(b.id)}">${sv?"♥ "+t("savedBook"):"♡ "+t("saveBook")}</button><button class="btn" type="button" id="dShare">⤴ ${t("share")}</button>
 ${own?`<button class="btn" type="button" id="dEdit">${t("edit")}</button><button class="btn danger" type="button" id="dDel">${t("del")}</button>`:`<button class="btn" type="button" id="dRep">⚑ ${t("report")}</button>`}
 <button class="btn pri" type="button" id="dPhone">${t("showPhone")}</button></div><p class="note">${t("arrange")}</p>`;
 openD("detDlg");
 $("dShare").onclick=async()=>{const u=location.origin+location.pathname+"#b-"+b.id;try{if(navigator.share)await navigator.share({title:b.title,text:b.title+" — "+money(b.price),url:u});else{await navigator.clipboard.writeText(u);toast(t("linkCopied"))}}catch{}};
 $("dPhone").onclick=async()=>{if(!S.user){toast(t("needLoginP"));closeD("detDlg");setMode("login");openD("loginDlg");return}
  const pb=$("dPhone");pb.disabled=true;const {data,error}=await db.rpc("get_book_phone",{book_id:b.id});
  if(error||!data){pb.disabled=false;toast(error?error.message:t("noPhone"));return}
  const n=String(data).replace(/\D/g,""),w=n.startsWith("88")?n:"88"+n;
  $("dAct").insertAdjacentHTML("beforeend",`<a class="btn pri" href="tel:+${w}">📞 ${esc(data)}</a><a class="btn" href="https://wa.me/${w}" target="_blank" rel="noopener">${t("wa")}</a>`);pb.remove()};
 if(!own)$("dRep").onclick=()=>{if(!S.user){toast(t("needLoginR"));return}repId=b.id;openD("repDlg")};
 if(own){$("dEdit").onclick=()=>{closeD("detDlg");editBook(b)};
  $("dDel").onclick=async()=>{if(!confirm(t("confirmDel")))return;const {error}=await db.from("books").delete().eq("id",b.id).eq("user_id",S.user.id);
   if(error){toast(error.message);return}books=books.filter(x=>x.id!==b.id);rmPhotos(b.photos);saved.delete(b.id);persist();total=Math.max(0,(total||1)-1);closeD("detDlg");render();toast(t("deleted"))}}
}
$("detBox").addEventListener("click",e=>{const p=e.target.closest("[data-ph]");if(!p)return;$("dcv").innerHTML=`<img src="${esc(p.querySelector("img").src)}" alt="">`;$("detBox").querySelectorAll(".th .thb").forEach(i=>i.classList.toggle("on",i===p))});

$("pwT").onclick=()=>{const p=$("aPass");p.type=p.type==="password"?"text":"password";$("pwT").textContent=t(p.type==="password"?"showPw":"hidePw")};
$("repForm").addEventListener("submit",async e=>{e.preventDefault();if(!db||!repId)return;const note=$("repNote").value.trim(),reason=($("repWhy").value+(note?": "+note:"")).slice(0,500);
 const {error}=await db.from("reports").insert({book_id:repId,reason});closeD("repDlg");$("repNote").value="";toast(error?error.message:t("reported"))});
$("loginDlg").addEventListener("cancel",e=>{if(document.body.classList.contains("auth-required"))e.preventDefault()});
/* events */
function save(id){saved.has(id)?saved.delete(id):saved.add(id);persist();if(S.savedOnly&&!saved.has(id)){books=books.filter(b=>b.id!==id);total=Math.max(0,(total||1)-1)}render();if($("detDlg").open){books.some(b=>b.id===id)||extra.has(id)?show(id):closeD("detDlg")}}
$("grid").addEventListener("click",e=>{const s=e.target.closest("[data-save]");if(s){save(s.dataset.save);return}const o=e.target.closest("[data-open]");if(o)show(o.dataset.open)});
$("detBox").addEventListener("click",e=>{const s=e.target.closest("[data-save]");if(s)save(s.dataset.save)});
$("cats").onclick=e=>{const b=e.target.closest("[data-cat]");if(!b)return;S.cat=b.dataset.cat;cats();load(true)};
$("sf").onsubmit=e=>{e.preventDefault();S.q=$("q").value;load(true);$("marketplace").scrollIntoView()};
$("q").oninput=e=>{S.q=e.target.value;reload()};
$("loc").onchange=e=>{S.city=e.target.value;load(true)};
$("cond").onchange=e=>{S.cond=e.target.value;load(true)};
$("sort").onchange=e=>{S.sort=e.target.value;load(true)};
$("maxp").oninput=e=>{S.maxp=e.target.value;reload()};
$("savedBtn").onclick=()=>{S.savedOnly=!S.savedOnly;load(true)};
$("moreBtn").onclick=()=>{if(!loading)load(false)};
["lang","lang2"].forEach(id=>$(id).onchange=e=>{L=e.target.value;try{localStorage.setItem("bb_lang",L)}catch{}applyLang()});
document.addEventListener("click",e=>{
 const c=e.target.closest("[data-close]");if(c)closeD(c.dataset.close);if(e.target.id==="retry")load(true);if(e.target.id==="emptySell")openSell();if(e.target.closest("[data-legal]")){e.preventDefault();openD("legalDlg")}
 if(e.target.id==="resetF"){Object.assign(S,{q:"",cat:"all",city:"all",cond:"any",sort:"newest",maxp:"",savedOnly:false,mine:false});$("q").value="";$("maxp").value="";applyLang();load(true)}
});
document.querySelectorAll("dialog").forEach(d=>{let dn=false;d.addEventListener("pointerdown",e=>{dn=e.target===d});d.addEventListener("click",e=>{if(e.target===d&&dn&&!d.querySelector("form"))d.close();dn=false})});
applyLang();if(!db){setAuthGate(null);$("aMsg").textContent=t("noDb")}else{setAuthGate(null)}
</script>
</body>
</html>
